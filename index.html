  <title>A Dot</title>
  <style>

    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper)}

    #metrics.visible{opacity:1;pointer-events:auto}.report{width:min(1240px,100%);padding:clamp(18px,4vw,44px) 0}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(34px,4vw,58px)}section{min-width:0}
    h2{margin:0 0 23px;font:500 clamp(30px,5vw,49px)/.98 Georgia,'Times New Roman',serif;letter-spacing:-.035em}dl{margin:0}.row{display:flex;justify-content:space-between;gap:22px;padding:10px 0;border-bottom:1px solid var(--hair)}
    dt{color:var(--muted);font:500 11px/1.3 ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.07em;text-transform:uppercase}dd{margin:0;text-align:right;font:500 14px/1.3 ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

:.05em;text-transform:uppercase}.report-actions{display:flex;align-items:center;gap:12px;margin-top:clamp(42px,8vh,78px);padding-top:24px;border-top:1px solid var(--hair);flex-wrap:wrap}.report-actions .primary{background:var(--ink);color:var(--paper)}.report-actions .primary:hover,.report-actions .primary:focus-visible{background:var(--bloom);border-color:var(--bloom);color:#fff}.method-strip{grid-column:1/-1;display:grid;grid-template-columns:minmax(180px,.42fr) 1fr;gap:clamp(24px,5vw,72px);padding:30px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}.method-strip h2{margin:0}.method-copy{margin:0;color:var(--muted);font:400 13px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:72ch}.method-copy strong{color:var(--ink)}
